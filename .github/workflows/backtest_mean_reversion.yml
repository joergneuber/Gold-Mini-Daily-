name: Backtest Mean-Reversion (XAU/USD, Tagesbasis)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install requests pandas numpy
      - name: Backtest ausführen
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python backtest_mean_reversion.py
      - name: Ergebnisse als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backtest-mean-reversion-ergebnisse
          path: |
            backtest_mean_reversion_trades.csv
            mean_reversion_tagesdaten_roh.csv
