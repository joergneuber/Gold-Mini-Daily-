name: Backtest V1 Gold

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas numpy

      - name: Backtest ausführen
        run: python backtest/backtest_v1.py

      - name: Trade-Log als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv
