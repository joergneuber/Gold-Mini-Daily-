name: Mini Daily Gold

on:
  schedule:
    # Automatische Starts in Europe/Berlin. GitHub beruecksichtigt damit
    # Sommer-/Winterzeit automatisch. Die bestehende Code-Logik bleibt
    # unveraendert: 05:00, 07:30, 10:00, 12:45, 14:00, 16:30, 19:00, 20:30.
    - cron: "0 5,10,14,19 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "30 7,16,20 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "45 12 * * 1-5"
      timezone: "Europe/Berlin"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Trade-Alert-Status wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: trade_alert_state.json
          key: gold-trade-alert-state-${{ github.run_id }}
          restore-keys: |
            gold-trade-alert-state-

      # 90-Minuten-Toleranz: Ein automatischer Cron-Lauf darf bis
      # maximal 90 Minuten nach seiner jeweiligen Sollzeit laufen.
      - name: Cron-Verzögerung prüfen (90 Minuten)
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TOLERANZ_MINUTEN = 90
          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          schedule = os.environ.get("SCHEDULE", "").strip()

          erlaubte_crons = {
              "0 5,10,14,19 * * 1-5",
              "30 7,16,20 * * 1-5",
              "45 12 * * 1-5",
          }

          if schedule not in erlaubte_crons:
              raise SystemExit(f"Unbekannter Cron-Ausdruck: {schedule}")

          teile = schedule.split()
          minute = int(teile[0])
          stunden = [int(x) for x in teile[1].split(",")]

          kandidaten = []
          for stunde in stunden:
              ziel = jetzt.replace(
                  hour=stunde,
                  minute=minute,
                  second=0,
                  microsecond=0,
              )
              if ziel <= jetzt:
                  kandidaten.append(ziel)

          if not kandidaten:
              raise SystemExit("Cron-Lauf wurde vor der Sollzeit gestartet.")

          zielzeit = max(kandidaten)
          verzoegerung = int((jetzt - zielzeit).total_seconds() // 60)

          print(f"Cron: {schedule}")
          print(f"Sollzeit: {zielzeit.strftime('%Y-%m-%d %H:%M:%S %Z')}")
          print(f"Aktuelle Zeit: {jetzt.strftime('%Y-%m-%d %H:%M:%S %Z')}")
          print(f"Verzögerung: {verzoegerung} Minuten")
          print(f"Erlaubte Verzögerung: {TOLERANZ_MINUTEN} Minuten")

          if verzoegerung > TOLERANZ_MINUTEN:
              raise SystemExit("Cron-Lauf liegt außerhalb des 90-Minuten-Fensters.")

          print("Cron-Lauf innerhalb des erlaubten 90-Minuten-Fensters.")
          PY

      # Reine Diagnose: verändert weder Zeitplan noch Report-Logik.
      # github.event.schedule zeigt bei schedule-Runs den tatsächlich
      # auslösenden Cron-Ausdruck an.
      - name: Schedule-Diagnose
        run: |
          echo "========== SCHEDULE-DIAGNOSE =========="
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run-ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "UTC:"
          date -u '+%Y-%m-%d %H:%M:%S %Z'
          echo "Europe/Berlin:"
          TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z (%z)'
          echo "========================================"

      - name: Report erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python mini_daily_gold.py

      - name: Separate Trade-Alerts senden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_trade_alerts.py

      - name: Trade-Alert-Status speichern
        uses: actions/cache/save@v4
        with:
          path: trade_alert_state.json
          key: gold-trade-alert-state-${{ github.run_id }}

      - name: Nach Google Drive hochladen
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python upload_to_drive.py

      - name: Mail versenden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_mail.py
