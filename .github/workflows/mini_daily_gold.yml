name: Mini Daily Gold

on:
  schedule:
    - cron: "0 6,9,12,15,18,21 * * 1-5"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Report erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python mini_daily_gold.py

      - name: Nach Google Drive hochladen
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python upload_to_drive.py

      - name: Mail versenden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_mail.py

      # Separate Trade-Event-Mail nur einmal pro eindeutigem Event.
      # Der Cache-Key basiert auf trade_alerts.json; bei identischem Event
      # (z.B. manueller Workflow-Neustart derselben Kerze) wird die Mail nicht
      # erneut verschickt. Der eigentliche Event-Inhalt wird NICHT gecacht.
      - name: Trade-Alert-Deduplizierungsdatei vorbereiten
        run: echo "${{ hashFiles('trade_alerts.json') }}" > .trade_alert_cache_marker

      - name: Trade-Alert-Event pruefen
        id: trade_alert_cache
        uses: actions/cache@v4
        with:
          path: .trade_alert_cache_marker
          key: gold-trade-alert-${{ hashFiles('trade_alerts.json') }}

      - name: Separate Trade-Alert-Mails versenden
        if: steps.trade_alert_cache.outputs.cache-hit != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_trade_alerts.py
