name: Mini Daily Gold

on:
  schedule:
    # GitHub Actions kennt nur UTC-Cron, keine Zeitzonen. Deshalb wird hier
    # die Vereinigung aus Winter- (CET, UTC+1) und Sommerzeit (CEST, UTC+2)
    # der gewuenschten Berliner Zielzeiten (05:00/08:00/11:00/14:00/16:30/
    # 19:30/22:30) angemeldet - der Job "zeitzonen_check" unten filtert dann
    # zur Laufzeit anhand der TATSAECHLICHEN aktuellen Berliner Uhrzeit
    # heraus, welcher der beiden Saetze gerade zutrifft. Ergebnis: der Report
    # laeuft ganzjaehrig zu denselben 7 Berliner Uhrzeiten, unabhaengig von
    # Sommer-/Winterzeit.
    - cron: "0 3,4,6,7,9,10,12,13 * * 1-5"
    - cron: "30 14,15,17,18,20,21 * * 1-5"
  workflow_dispatch: {}

jobs:
  zeitzonen_check:
    runs-on: ubuntu-latest
    outputs:
      soll_laufen: ${{ steps.check.outputs.soll_laufen }}
    steps:
      - name: Berliner Zielzeit pruefen
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # Manueller Start (workflow_dispatch) laeuft immer, unabhaengig
            # von der Uhrzeit - unveraendertes Verhalten wie bisher.
            echo "soll_laufen=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jetzt_h=$(TZ=Europe/Berlin date +%-H)
          jetzt_m=$(TZ=Europe/Berlin date +%-M)
          jetzt_gesamt=$((jetzt_h * 60 + jetzt_m))
          # Zielzeiten in Minuten seit Mitternacht (Europe/Berlin):
          # 05:00, 08:00, 11:00, 14:00, 16:30, 19:30, 22:30
          ziele="300 480 660 840 990 1170 1350"
          soll=false
          for ziel in $ziele; do
            diff=$((jetzt_gesamt - ziel))
            # Toleranzfenster 0-15 Minuten nach der Zielzeit (Cron-Trigger
            # koennen sich leicht verzoegern; die Zielzeiten liegen min.
            # 2,5h auseinander, daher kein Ueberlappungsrisiko).
            if [ "$diff" -ge 0 ] && [ "$diff" -le 15 ]; then
              soll=true
            fi
          done
          echo "Aktuelle Berliner Zeit: ${jetzt_h}:${jetzt_m} (Minute ${jetzt_gesamt})"
          echo "soll_laufen=$soll" >> "$GITHUB_OUTPUT"

  run:
    needs: zeitzonen_check
    if: needs.zeitzonen_check.outputs.soll_laufen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Trade-Alert-Status wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: trade_alert_state.json
          key: gold-trade-alert-state-${{ github.run_id }}
          restore-keys: |
            gold-trade-alert-state-

      - name: Report erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python mini_daily_gold.py

      - name: Separate Trade-Alerts senden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_trade_alerts.py

      - name: Trade-Alert-Status speichern
        uses: actions/cache/save@v4
        with:
          path: trade_alert_state.json
          key: gold-trade-alert-state-${{ github.run_id }}

      - name: Nach Google Drive hochladen
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python upload_to_drive.py

      - name: Mail versenden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_mail.py
