name: Backtest V1e Gold (Positionstrading)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas numpy
      - name: Backtest ausführen
        run: python backtest/backtest_v1e.py
      - name: Trade-Log als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v1e-trades
          path: backtest_v1e_trades.csv
