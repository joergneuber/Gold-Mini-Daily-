name: Backtest V1d Gold (Trendfolge + Scaling-out)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas numpy
      - name: Backtest ausführen
        run: python backtest/backtest_v1d.py
      - name: Trade-Log als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v1d-trades
          path: backtest_v1d_trades.csv
