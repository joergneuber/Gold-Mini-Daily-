name: PAXG Prototyp Test

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r paxg-prototyp/requirements.txt

      - name: Prototyp ausführen
        run: python paxg-prototyp/paxg_prototyp.py
